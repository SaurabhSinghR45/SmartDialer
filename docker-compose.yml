services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdialer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartdialer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdialer"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dialer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdialer-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/smartdialer?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: smartdialer-frontend
    depends_on:
      - dialer
    ports:
      - "3000:80"
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdialer-simulator
    entrypoint: ["simulator", "--all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/smartdialer?sslmode=disable
    profiles:
      - sim

volumes:
  pgdata:
